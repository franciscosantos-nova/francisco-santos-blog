<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#FFFFFF"/>

  <!-- token lane flowing in -->
  <rect x="60" y="295" width="700" height="40" rx="20" fill="#EEF2FC"/>
  <line x1="90" y1="315" x2="720" y2="315" stroke="#E7E8EC" stroke-width="3"/>
  <rect x="120" y="303" width="22" height="22" rx="6" fill="#1E3A8A"/>
  <rect x="260" y="301" width="26" height="26" rx="7" fill="#1E3A8A"/>
  <rect x="400" y="304" width="20" height="20" rx="5" fill="#1E3A8A"/>
  <rect x="540" y="302" width="24" height="24" rx="6" fill="#1E3A8A"/>

  <!-- funnel merging tokens into the card -->
