  <!-- card -->
  <rect x="820" y="205" width="320" height="200" rx="24" fill="#1E3A8A"/>
  <rect x="860" y="250" width="56" height="42" rx="7" fill="#EEF2FC" opacity="0.85"/>
  <rect x="860" y="335" width="220" height="12" rx="6" fill="#EEF2FC" opacity="0.5"/>
  <rect x="860" y="362" width="140" height="12" rx="6" fill="#EEF2FC" opacity="0.5"/>

  <!-- contactless signal -->
  <g stroke="#EEF2FC" stroke-width="6" fill="none" opacity="0.9">
    <path d="M1070 255 A 20 20 0 0 1 1070 295"/>
    <path d="M1090 240 A 42 42 0 0 1 1090 310"/>
    <path d="M1110 225 A 65 65 0 0 1 1110 325"/>
